# ─────────────────────────────────────────────────────────────────────────────
#  shop.i3x.dev  —  behind Cloudflare, Cloudflare Origin Certificate
#
#  Install:
#    sudo cp shop.i3x.dev.conf /etc/nginx/sites-available/shop.i3x.dev
#    sudo ln -s /etc/nginx/sites-available/shop.i3x.dev /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#
#  The certificate files must exist FIRST or `nginx -t` fails and a reload
#  would take api.i3x.dev, i3x.dev and explorer.i3x.dev down with it.
#  See NGINX-SETUP.md step 1 — generate the origin cert before installing this.
#
#  Cloudflare SSL/TLS mode must be **Full (strict)**. Origin CA certificates
#  are trusted by Cloudflare specifically, so strict works; anything less means
#  Cloudflare talks to this box in the clear.
#
#  These certificates are deliberately NOT publicly trusted. Hitting the origin
#  IP directly in a browser gives a certificate warning, which is correct — the
#  only client that should ever reach this server is Cloudflare.
# ─────────────────────────────────────────────────────────────────────────────

# Real client IPs. Everything arrives from Cloudflare, so without this every
# log line, rate limit, and fraud signal sees a Cloudflare address instead of
# the shopper. Refresh from https://www.cloudflare.com/ips/
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

upstream shop_i3x {
    server 127.0.0.1:4321;
    keepalive 16;
}

# Cloudflare handles the public HTTP→HTTPS redirect ("Always Use HTTPS"), but
# keep this so a direct request to the origin on :80 is not served in clear.
server {
    listen 80;
    listen [::]:80;
    server_name shop.i3x.dev;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name shop.i3x.dev;

    # Cloudflare Origin Certificate — see NGINX-SETUP.md step 1.
    ssl_certificate     /etc/ssl/cloudflare/shop.i3x.dev.pem;
    ssl_certificate_key /etc/ssl/cloudflare/shop.i3x.dev.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    # Optional but recommended: refuse any TLS connection that did not come
    # from Cloudflare, so finding the origin IP is not enough to bypass it.
    # Download the CA once:
    #   sudo curl -o /etc/ssl/cloudflare/origin-pull-ca.pem \
    #     https://developers.cloudflare.com/ssl/static/authenticated_origin_pull_ca.pem
    # Then enable "Authenticated Origin Pulls" in the Cloudflare dashboard and
    # uncomment these two lines.
    # ssl_client_certificate /etc/ssl/cloudflare/origin-pull-ca.pem;
    # ssl_verify_client on;

    # Do not advertise the software or version: a matching fingerprint across
    # two supposedly unrelated sites is a link.
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    root /home/cesmii/repos/nerd-store/apps/storefront/dist-i3x/client;
    index index.html;

    access_log /var/log/nginx/shop.i3x.dev.access.log;
    error_log  /var/log/nginx/shop.i3x.dev.error.log;

    client_max_body_size 1m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed asset filenames, safe to cache forever. The directory is named
    # per store (_i3x), so the two shops share no asset path.
    location /_i3x/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Stripe signs the raw request body. Buffering or rewriting it breaks
    # signature verification, so this block comes before the general /api/ one.
    location = /api/webhook/stripe {
        proxy_pass http://shop_i3x;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    # The only routes that must be live: cart, availability, checkout, orders.
    location ~ ^/(api|order)/ {
        proxy_pass http://shop_i3x;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;              # the app re-checks this
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        # Carts and order pages are per-customer. Never cache them, at nginx
        # or at the edge.
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store" always;
    }

    # Prerendered pages: /shop/how-machines-talk -> .../index.html
    location / {
        try_files $uri $uri/index.html $uri.html @ssr;
    }

    # Anything not prerendered falls through to the app.
    location @ssr {
        proxy_pass http://shop_i3x;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
