# shop.i3x.dev
#
# nginx serves the prerendered catalogue straight off disk and proxies only
# the routes that must be live. Two separate server blocks, two separate
# certificates -- never one cert with both names in its SAN list, because
# certificate transparency logs are public and permanently searchable.

upstream shop_i3x {
    server 127.0.0.1:4321;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name shop.i3x.dev;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name shop.i3x.dev;

    ssl_certificate     /etc/letsencrypt/live/shop.i3x.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.i3x.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Do not advertise the software or version: a matching fingerprint across
    # two supposedly unrelated sites is a link.
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    root /srv/nerd-store/apps/storefront/dist-i3x/client;
    index index.html;

    client_max_body_size 1m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed asset filenames -- safe to cache forever. The directory is named
    # per tenant (_i3x), so the two stores share no asset path.
    location /_i3x/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Live routes. Everything else is a static file.
    location ~ ^/(api|order)/ {
        proxy_pass http://shop_i3x;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;                    # the app re-checks this
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        # Carts and order pages are per-customer. Never cache them.
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store" always;
    }

    # Stripe needs the raw body for signature verification; nginx passes it
    # through untouched as long as we do not buffer or rewrite it.
    location = /api/webhook/stripe {
        proxy_pass http://shop_i3x;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_request_buffering off;
    }

    # Prerendered pages: /shop/palm-pre-3 -> /shop/palm-pre-3/index.html
    location / {
        try_files $uri $uri/index.html $uri.html @ssr;
    }

    # Anything not prerendered falls through to the app (404 page, new routes).
    location @ssr {
        proxy_pass http://shop_i3x;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
