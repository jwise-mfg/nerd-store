# ─────────────────────────────────────────────────────────────────────────────
#  shop.i3x.dev  —  behind Cloudflare, Cloudflare Origin Certificate
#
#  Install (symlinked, so `git pull` updates it):
#    sudo ln -s /home/cesmii/repos/nerd-store/deploy/nginx/shop.i3x.dev.conf \
#               /etc/nginx/sites-enabled/shop.i3x.dev.conf
#    sudo nginx -t && sudo systemctl reload nginx
#
#  The certificate files must exist FIRST or `nginx -t` fails, and a reload
#  would take api.i3x.dev, i3x.dev and explorer.i3x.dev down with it.
#
#  Cloudflare SSL/TLS mode must be **Full (strict)**.
#
#  There is no application server and no port to proxy to. PHP-FPM runs the
#  one entry point; everything else on disk is served by nginx directly.
# ─────────────────────────────────────────────────────────────────────────────

# Real client IPs come from deploy/nginx/cloudflare-real-ip.conf, which is
# included once at http level -- see the install note in that file.

# Cloudflare handles the public HTTP→HTTPS redirect ("Always Use HTTPS"), but
# keep this so a direct request to the origin on :80 is not served in clear.
server {
    listen 80;
    listen [::]:80;
    server_name shop.i3x.dev;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name shop.i3x.dev;

    ssl_certificate     /etc/ssl/cloudflare/shop.i3x.dev.pem;
    ssl_certificate_key /etc/ssl/cloudflare/shop.i3x.dev.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    # Optional: refuse any TLS connection that did not come from Cloudflare.
    #   sudo curl -o /etc/ssl/cloudflare/origin-pull-ca.pem \
    #     https://developers.cloudflare.com/ssl/static/authenticated_origin_pull_ca.pem
    # ssl_client_certificate /etc/ssl/cloudflare/origin-pull-ca.pem;
    # ssl_verify_client on;

    # Do not advertise the software or version: a matching fingerprint across
    # two supposedly unrelated sites is a link.
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # This store's own document root: its stylesheet, brand images and
    # product photographs are ordinary files in here.
    root /home/cesmii/repos/nerd-store/stores/i3x/public;
    index index.php;

    access_log /var/log/nginx/shop.i3x.dev.access.log;
    error_log  /var/log/nginx/shop.i3x.dev.error.log;

    client_max_body_size 1m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Long-lived static assets. Product photographs are reached through the
    # img -> ../products symlink, so they stay in the folder with the
    # product.json that describes them.
    location ~* \.(css|png|jpe?g|webp|avif|gif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Only index.php ever executes. Nothing else under the document root is
    # PHP, and this makes that structural rather than a matter of trust.
    location = /index.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_read_timeout 30s;
    }
    location ~ \.php$ { return 404; }

    # Carts and order pages are per-customer. The app sends no-store itself;
    # this stops the edge caching them even if that is ever missed.
    location /order/ {
        try_files $uri /index.php$is_args$args;
        add_header Cache-Control "no-store" always;
    }
}
